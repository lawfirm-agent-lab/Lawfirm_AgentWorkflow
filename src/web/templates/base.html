<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Expert Case Matching{% endblock %}</title>
<style>
:root{--bg:#fff;--fg:#1d2329;--muted:#5f6b76;--line:#d9dee3;--card:#f6f8fa;--accent:#0b5cad;--ok:#0f7b3f;--warn:#b42318;--run:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--fg:#e6edf3;--muted:#9aa7b3;--line:#30363d;--card:#161b22;--accent:#58a6ff;--ok:#3fb950;--warn:#f85149;--run:#d29922}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 8px}
.muted{color:var(--muted)}a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0}
table{border-collapse:collapse;width:100%}th,td{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.wrap{overflow-x:auto}
.pill{display:inline-block;border-radius:10px;padding:0 8px;font-size:12px;border:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.run{color:var(--run)}
.error{border-color:var(--warn);color:var(--warn)}
button{font:inherit;padding:8px 18px;border-radius:6px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.5;cursor:not-allowed}
label{display:block;margin:6px 0}
.or{margin:10px 0;color:var(--muted);font-size:12px;text-transform:uppercase}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 16px}.bar div{height:100%;background:var(--accent);transition:width .4s}
.steps li{margin:4px 0}
</style>
</head>
<body><main>
{% block body %}{% endblock %}
</main></body>
</html>
