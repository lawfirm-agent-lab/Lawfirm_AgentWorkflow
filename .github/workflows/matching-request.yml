name: Match an uploaded CV

# Started by the database when someone uploads a CV on the results website (migration 009,
# matching_dispatch, through pg_net with the token in Supabase Vault). Also runnable by hand.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request id from the website (matching_requests)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: matching-request-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  match:
    name: Find, screen and match cases for the uploaded CV
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REQUEST_ID: ${{ inputs.request_id }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the matching for the uploaded CV
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Same model choice as daily-matching.yml.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_EXTRA_BODY: ${{ vars.LLM_EXTRA_BODY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MATCHING_LLM_PROVIDER: ${{ vars.MATCHING_LLM_PROVIDER }}
          MATCHING_LLM_BASE_URL: ${{ vars.MATCHING_LLM_BASE_URL }}
          MATCHING_LLM_MODEL: ${{ vars.MATCHING_LLM_MODEL }}
          MATCHING_LLM_EXTRA_BODY: ${{ vars.MATCHING_LLM_EXTRA_BODY }}
          MATCHING_LLM_API_KEY: ${{ secrets.MATCHING_LLM_API_KEY }}
        run: |
          if [ -n "$MATCHING_LLM_MODEL" ]; then
            export LLM_PROVIDER="$MATCHING_LLM_PROVIDER" LLM_BASE_URL="$MATCHING_LLM_BASE_URL" \
              LLM_MODEL="$MATCHING_LLM_MODEL" LLM_EXTRA_BODY="$MATCHING_LLM_EXTRA_BODY" \
              LLM_API_KEY="$MATCHING_LLM_API_KEY"
          fi
          python -m src.web.request --id "$REQUEST_ID"
      # A cancelled or timed-out job would otherwise leave the request "running" forever.
      - name: Mark the request failed if the job did not finish
        if: failure() || cancelled()
        run: python -m src.web.request --id "$REQUEST_ID" --mark-failed "The cloud run stopped before finishing."
