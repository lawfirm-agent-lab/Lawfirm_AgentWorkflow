name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit:
    name: Offline unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: lawfirm_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d lawfirm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests against disposable PostgreSQL
        env:
          TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: python tests/integration/postgres_checks.py
      - name: Run pipeline tests against disposable PostgreSQL
        env:
          TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: python tests/integration/pipeline_checks.py
