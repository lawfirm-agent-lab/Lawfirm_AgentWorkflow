name: Run docket pipeline

on:
  schedule:
    # Every two hours. GitHub may delay or skip scheduled runs under load.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render digests without sending email or changing delivery state
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docket-monitor
  cancel-in-progress: false

jobs:
  run:
    name: Detect, analyze, route and deliver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Optional repository variable: rules (default) | rules+shadow | llm.
          ANALYZER: ${{ vars.ANALYZER }}
          # LLM provider settings; only read when ANALYZER is llm or rules+shadow.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_EXTRA_BODY: ${{ vars.LLM_EXTRA_BODY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.pipeline.runner --dry-run
          else
            python -m src.pipeline.runner
          fi
