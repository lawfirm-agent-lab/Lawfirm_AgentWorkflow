name: Daily new cases for saved CVs

on:
  # The daily run is started at 11:30 UTC by Supabase pg_cron (migration 013), because GitHub's
  # schedule can run hours late. GitHub's schedule below is only a backup: it checks the CVs that
  # had no daily check in the last 20 hours. The 2-day window covers a missed day either way, and
  # cases shown before are left out.
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Complaints filed in the last N days
        type: choice
        options: ["1", "2", "3", "7"]
        default: "2"

permissions:
  contents: read

concurrency:
  group: daily-matching
  cancel-in-progress: false

jobs:
  check:
    name: Find, screen and match new complaints
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the daily check for every CV saved in the cloud
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # The docket pipeline's LLM settings, unless MATCHING_LLM_MODEL is set: then all of
          # MATCHING_LLM_* replace them, so matching can use another provider (e.g. OpenRouter).
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_EXTRA_BODY: ${{ vars.LLM_EXTRA_BODY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MATCHING_LLM_PROVIDER: ${{ vars.MATCHING_LLM_PROVIDER }}
          MATCHING_LLM_BASE_URL: ${{ vars.MATCHING_LLM_BASE_URL }}
          MATCHING_LLM_MODEL: ${{ vars.MATCHING_LLM_MODEL }}
          MATCHING_LLM_EXTRA_BODY: ${{ vars.MATCHING_LLM_EXTRA_BODY }}
          MATCHING_LLM_API_KEY: ${{ secrets.MATCHING_LLM_API_KEY }}
          DAYS: ${{ inputs.days || '2' }}
          BACKUP: ${{ github.event_name == 'schedule' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ -n "$MATCHING_LLM_MODEL" ]; then
            export LLM_PROVIDER="$MATCHING_LLM_PROVIDER" LLM_BASE_URL="$MATCHING_LLM_BASE_URL" \
              LLM_MODEL="$MATCHING_LLM_MODEL" LLM_EXTRA_BODY="$MATCHING_LLM_EXTRA_BODY" \
              LLM_API_KEY="$MATCHING_LLM_API_KEY"
          fi
          echo "LLM model: $LLM_MODEL"
          if [ "$BACKUP" = "true" ]; then
            python -m src.web.daily --cloud --days "$DAYS" --skip-checked-within 20
          else
            python -m src.web.daily --cloud --days "$DAYS"
          fi
