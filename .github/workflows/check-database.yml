name: Check cloud database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Read-only connection and TLS check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify database connection without creating tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m src.store.check_connection
